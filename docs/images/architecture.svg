<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" role="img"><title>Ejar Pro self-hosted deployment architecture</title><rect width="1100" height="280" rx="23" fill="#0d1b2b"/><text x="42" y="55" font-size="30" fill="white" font-family="Arial,sans-serif" font-weight="bold">Simple, self-hosted architecture</text><text x="42" y="88" font-size="17" fill="#b3d0df" font-family="Arial,sans-serif">Single FastAPI application · SQLite database in a persistent Docker volume</text><g font-family="Arial,sans-serif" text-anchor="middle"><rect x="52" y="117" width="238" height="116" rx="17" fill="#18364f" stroke="#54abc9"/><text x="171" y="163" fill="white" font-size="24">Browser</text><text x="171" y="196" fill="#b4d8ea" font-size="17">Arabic web interface</text><path d="M298 176H401" stroke="#4adeb8" stroke-width="4"/><path d="m391 168 11 8-11 8" fill="none" stroke="#4adeb8" stroke-width="4"/><rect x="411" y="117" width="251" height="116" rx="17" fill="#17453e" stroke="#47d4aa"/><text x="536" y="163" fill="white" font-size="24">FastAPI</text><text x="536" y="196" fill="#b4efd9" font-size="17">Auth · Contracts · Payments</text><path d="M670 176H773" stroke="#4adeb8" stroke-width="4"/><path d="m763 168 11 8-11 8" fill="none" stroke="#4adeb8" stroke-width="4"/><rect x="783" y="117" width="264" height="116" rx="17" fill="#18364f" stroke="#54abc9"/><text x="915" y="163" fill="white" font-size="24">SQLite</text><text x="915" y="196" fill="#b4d8ea" font-size="17">Persistent /data volume</text></g></svg>