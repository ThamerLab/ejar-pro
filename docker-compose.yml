services:
  ejar-pro:
    build: .
    container_name: ejar-pro
    ports:
      - "${BIND_IP:-127.0.0.1}:${APP_PORT:-9090}:8000"
    volumes:
      - ejar_data:/data
    environment:
      - DB_PATH=/data/ejar.db
      - SECURE_COOKIES=${SECURE_COOKIES:-false}
      - SECRET_KEY=${SECRET_KEY:?Set a strong random SECRET_KEY in .env}
      - ADMIN_USERNAME=${ADMIN_USERNAME:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set a unique ADMIN_PASSWORD in .env}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ejar_data:
    driver: local
